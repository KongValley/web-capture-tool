<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
<title>网页抓取工具</title>
<style>
  :root {
    --bg: #15171b; --bg-2: #191b1f; --panel: #1f2329; --elev: #262b32; --elev-2: #2b3138;
    --line: #2f353d; --line-2: #3a4149; --fg: #e8eaed; --muted: #9aa3ad;
    --accent: #4c8dff; --accent-dim: #4c8dff33; --sel: #2b4a80;
    --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --radius-sm: 4px; --radius: 6px; --radius-lg: 10px; --ctl-h: 28px;
    --shadow: 0 10px 30px #0007;
    --scroll: #ffffff1f; --scroll-hover: #ffffff42; --scroll-active: #4c8dffa0;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  ::selection { background: var(--accent-dim); }

  /* 滚动条：细身半透明胶囊，悬停变亮、拖动用主题色 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background-color: var(--scroll);
    border: 2px solid transparent;
    border-radius: 999px;
    background-clip: content-box;
    transition: background-color .15s;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-hover); }
  ::-webkit-scrollbar-thumb:active { background-color: var(--scroll-active); }
  ::-webkit-scrollbar-corner { background: transparent; }
  /* 工具栏的横向滚动条更扁，避免吃掉 40px 行高 */
  #toolbar2::-webkit-scrollbar, #toolbar3::-webkit-scrollbar { height: 8px; }

  /* 控件统一 */
  button, input, select, textarea {
    font: inherit; color: var(--fg); background: var(--elev);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    height: var(--ctl-h); padding: 0 8px;
    transition: background .12s, border-color .12s;
  }
  textarea { height: auto; padding: 6px 8px; resize: vertical; }
  label { display: inline-flex; align-items: center; gap: 4px; }
  input[type=checkbox] { height: auto; width: auto; padding: 0; }
  button { cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--elev-2); border-color: var(--line-2); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #5c98ff; border-color: #5c98ff; }
  button.ghost { background: transparent; }
  button.ghost:hover:not(:disabled) { background: var(--elev); }
  :focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-dim); }

  /* 工具栏（四行高度必须与 state.js 的 TOOLBAR_H = 164 一致） */
  #toolbar {
    height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  #toolbar2, #toolbar3 {
    height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    overflow-x: auto; overflow-y: hidden; white-space: nowrap;
  }
  .lbl { color: var(--muted); font-size: 12px; flex: none; }
  #recToggle.on { background: #f8514922; border-color: var(--err); color: var(--err); }

  /* 标签栏（第四行，全宽；高度计入 TOOLBAR_H） */
  #tabstrip {
    height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
    border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; overflow-y: hidden;
  }
  #tabList { display: flex; gap: 4px; }
  .tabchip {
    display: flex; align-items: center; gap: 6px; height: 28px; max-width: 220px; padding: 0 8px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--elev);
    cursor: pointer; font-size: 12px; flex: none;
  }
  .tabchip.on { background: var(--sel); border-color: var(--accent); }
  .tabchip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabchip .x { color: var(--muted); }
  .tabchip .x:hover { color: var(--err); }
  .num { width: 58px; }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; flex: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; height: var(--ctl-h);
    padding: 0 10px; background: var(--elev); border: 1px solid var(--line); border-radius: 999px;
    flex: none;
  }
  #url { flex: 1; min-width: 80px; }
  #status { color: var(--muted); font-size: 12px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  #count { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 600; }

  #body { height: calc(100% - 164px); display: flex; }
  #pageArea { flex: 1; min-width: 0; }
  #panel {
    width: 520px; flex: none; display: flex; flex-direction: column; position: relative;
    border-left: 1px solid var(--line); background: var(--panel);
  }
  /* 拖拽条必须在面板内部：原生视图盖在左侧区域之上，放到外面收不到鼠标事件 */
  #splitter { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; z-index: 6; cursor: col-resize; background: transparent; }
  #splitter:hover, #splitter.on { background: var(--accent-dim); }

  /* GPU/软件渲染提示条 */
  #banner {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: #d299221f; border-bottom: 1px solid var(--line);
    color: var(--warn); font-size: 12px;
  }
  #bannerText { flex: 1; min-width: 0; }
  #bannerActions { display: flex; gap: 6px; flex: none; }
  #banner button { height: 22px; font-size: 12px; }
  #recPanel { max-height: 150px; overflow: auto; border-bottom: 1px solid var(--line); background: var(--bg-2); }
  #recHead { padding: 4px 8px; position: sticky; top: 0; background: var(--bg-2); }
  #recItems > div { padding: 1px 8px; font: 11px/1.4 Consolas, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #panelHead { display: flex; gap: 6px; padding: 6px; border-bottom: 1px solid var(--line); }
  #filter { flex: 1; min-width: 40px; }
  #tabs { display: flex; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--line); }
  .tab { border-radius: var(--radius-sm) var(--radius-sm) 0 0; border-bottom: none; }
  .tab.on { background: var(--bg); border-color: var(--accent); }
  #findbar { display: flex; align-items: center; gap: 6px; padding: 6px; border-bottom: 1px solid var(--line); }
  #findText { flex: 1; min-width: 40px; }
  #list { flex: 1; overflow: auto; scrollbar-gutter: stable; }
  #listNote { padding: 2px 8px; }
  #listNew { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px; z-index: 5; }
  #ctxMenu {
    position: fixed; z-index: 90; display: flex; flex-direction: column;
    background: var(--elev); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 4px;
  }
  #ctxMenu .ctx-item { text-align: left; height: 24px; border: none; background: transparent; }
  #ctxMenu .ctx-item:hover { background: var(--elev-2); }
  .row {
    display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px;
    border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .row:nth-child(even) { background: #ffffff05; }
  .row:hover { background: var(--elev); }
  .row.sel { background: var(--sel); }
  .row .m {
    width: 46px; flex: none; font-weight: 600; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm); background: var(--elev-2);
  }
  .row[data-m="GET"] .m { color: #7dd3fc; }
  .row[data-m="POST"] .m { color: #4ade80; }
  .row[data-m="PUT"] .m, .row[data-m="PATCH"] .m { color: #fbbf24; }
  .row[data-m="DELETE"] .m { color: #f87171; }
  .row .s { width: 34px; flex: none; text-align: right; }
  .row .u { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .row[data-restored="1"] .u::before { content: '⟲ '; color: var(--warn); }
  .row[data-star="1"] .m::before { content: '★'; color: var(--warn); margin-right: 2px; }
  .row .t { width: 62px; flex: none; color: var(--muted); text-align: right; }
  .row .z { width: 96px; flex: none; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; }
  #list[data-cols="d"] .z, #list[data-cols="t"] .z { display: none; }
  #list[data-cols="t"] .t { width: 66px; }
  .s2 { color: var(--ok); } .s3 { color: var(--warn); } .s4, .s5 { color: var(--err); }
  .muted { color: var(--muted); }

  #detail { flex: 1.15; overflow: auto; scrollbar-gutter: stable; border-top: 1px solid var(--line); padding: 10px; display: none; }
  #detail.on { display: block; }
  #detail h3 {
    margin: 12px 0 4px; font-size: 12px; color: var(--accent);
    padding-left: 7px; border-left: 2px solid var(--accent);
  }
  #detail pre {
    margin: 0; padding: 8px 10px; background: var(--bg-2); border: 1px solid var(--line);
    border-radius: var(--radius); white-space: pre-wrap; word-break: break-all;
    max-height: 260px; overflow: auto; font: 12px/1.45 Consolas, monospace;
  }
  #detail .kv { color: var(--muted); }
  .dbar { display: flex; gap: 6px; margin-bottom: 8px; }

  #wsView { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #wsView.on { display: flex; }
  #wsbar { display: flex; align-items: center; gap: 6px; padding: 6px; border-bottom: 1px solid var(--line); }
  #wsFilter { flex: 1; min-width: 40px; }
  #ws { flex: 1; overflow: auto; scrollbar-gutter: stable; padding: 8px; font: 12px/1.45 Consolas, monospace; }
  #ws div { white-space: pre-wrap; word-break: break-all; border-bottom: 1px solid var(--line); padding: 2px 0; }

  /* 瀑布图：按时间轴画条，颜色跟状态码一致 */
  #wfView { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #wfView.on { display: flex; }
  #wfbar { display: flex; align-items: center; gap: 10px; padding: 6px; border-bottom: 1px solid var(--line); }
  #wf { flex: 1; overflow: auto; scrollbar-gutter: stable; }
  .wfrow { position: relative; height: 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .wfrow:hover { background: var(--elev); }
  .wfrow .wfbar2 { position: absolute; top: 3px; height: 12px; border-radius: 2px; background: var(--accent); }
  .wfrow .wfbar2.s2 { background: var(--ok); }
  .wfrow .wfbar2.s3 { background: var(--warn); }
  .wfrow .wfbar2.s4, .wfrow .wfbar2.s5 { background: var(--err); }
  .wfrow .wfurl {
    position: absolute; left: 6px; top: 0; z-index: 1; font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; pointer-events: none;
  }
  .empty { color: var(--muted); padding: 16px; text-align: center; }

  /* 共用模态框 */
  #modal {
    position: fixed; inset: 0; background: #0009; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  #modalBox {
    width: min(960px, 92vw); max-height: 86vh; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); display: flex; flex-direction: column;
  }
  #modalHead {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: 600;
  }
  #modalBody { flex: 1; overflow: auto; scrollbar-gutter: stable; padding: 10px; }
  #modalFoot { display: flex; gap: 8px; justify-content: flex-end; padding: 8px; border-top: 1px solid var(--line); }
  #modal textarea { width: 100%; min-height: 64px; font: 12px/1.45 Consolas, monospace; }
  #modal table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  #modal th, #modal td { border: 1px solid var(--line); padding: 2px 6px; text-align: left; vertical-align: top; word-break: break-all; }
  #modal pre { white-space: pre-wrap; word-break: break-all; font: 12px/1.45 Consolas, monospace; }

  /* 轻提示 */
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: 440px; }
  .toast {
    background: var(--elev); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 8px 12px; box-shadow: var(--shadow);
    font-size: 12px; white-space: pre-line;
  }
  .toast.err { border-left-color: var(--err); }
  .toast.warn { border-left-color: var(--warn); }
  .toast.ok { border-left-color: var(--ok); }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="back" title="后退">←</button>
    <button id="fwd" title="前进">→</button>
    <button id="reload" title="刷新">⟳</button>
    <span class="sep"></span>
    <input id="url" placeholder="输入网址，例如 example.com（可在此页面登录）">
    <button id="go" class="primary">打开</button>
    <span class="sep"></span>
    <button id="toggle" title="暂停/继续抓取">暂停</button>
    <button id="clear" title="清空已抓取记录">清空</button>
    <span class="sep"></span>
    <button id="pageData" title="管理 Cookie / localStorage / sessionStorage，查看页面数据">会话数据</button>
    <button id="expAll" title="导出全部：页面数据 + Cookie + 请求记录 + WebSocket 帧">导出全部</button>
    <button id="expHtml" title="保存当前页 HTML">导出 HTML</button>
    <button id="expCookie" title="保存 Cookie 为 JSON">导出 Cookie</button>
    <span class="sep"></span>
    <span class="chip"><span id="count">0</span><span id="status">启动中</span></span>
  </div>

  <div id="toolbar2">
    <span class="lbl">拦截</span>
    <select id="blockMode" title="资源拦截（刷新后生效）">
      <option value="none">不拦截</option>
      <option value="assets">屏蔽图片·媒体·字体</option>
      <option value="keywords">关键字屏蔽</option>
    </select>
    <input id="blockKeywords" type="text" placeholder="关键字，逗号分隔" style="width:150px">
    <label class="lbl" title="只记录 XHR/Fetch 请求"><input id="recordOnly" type="checkbox"> 仅记 XHR/Fetch</label>
    <span class="sep"></span>
    <span class="lbl">限速</span>
    <select id="throttle" title="网络限速（CDP 模拟，立即生效）">
      <option value="off">不限速</option>
      <option value="3g">3G</option>
      <option value="slow">慢速</option>
    </select>
    <span class="sep"></span>
    <span class="lbl">UA</span>
    <select id="uaSel" title="User-Agent（刷新后生效）">
      <option value="">默认</option>
      <option value="win10">Win10 Chrome108</option>
      <option value="win7">Win7 Chrome108</option>
      <option value="android">Android Chrome</option>
      <option value="custom">自定义…</option>
    </select>
    <input id="uaCustom" type="text" placeholder="自定义 UA" style="width:200px" hidden>
    <span class="sep"></span>
    <span class="lbl">头</span>
    <input id="headers" type="text" placeholder="Referer=https://x; X-Token=abc" style="flex:1;min-width:120px">
    <span class="sep"></span>
    <span class="lbl">代理</span>
    <input id="proxy" type="text" placeholder="socks5://127.0.0.1:1080" style="width:170px">
    <button id="proxyTest" class="ghost" title="用当前代理设置访问当前站点，验证连通性与出口">测代理</button>
    <button id="saveRule" class="ghost" title="按规则把命中的响应体直接写进目录">落盘</button>
    <span class="sep"></span>
    <span class="lbl">间隔</span>
    <input id="reqDelay" class="num" type="number" min="0" max="10000" step="100" value="0" title="请求最小间隔 ms（礼貌抓取）">
    <button id="cfgAllTabs" class="ghost" title="把当前 UA / 请求头 / 限速应用到所有已打开标签">应用到所有标签</button>
  </div>

  <div id="toolbar3">
    <span class="lbl">自动滚动</span>
    <input id="scrollRounds" class="num" type="number" min="1" max="50" value="5" title="滚动轮数">
    <button id="autoScroll">开始</button>
    <span class="sep"></span>
    <span class="lbl">自动翻页</span>
    <input id="pageCount" class="num" type="number" min="1" max="100" value="3" title="总页数">
    <input id="pageDelay" class="num" type="number" min="200" max="60000" step="100" value="2000" title="每页间隔 ms" style="width:72px">
    <button id="autoPage">开始</button>
    <button id="autoStop" disabled>停止</button>
    <span class="sep"></span>
    <button id="extract">CSS 提取</button>
    <button id="harvest">页面清单</button>
    <span class="sep"></span>
    <button id="findPage" title="在页面内查找文本">页面查找</button>
    <button id="pageTools" title="截图 / 打印为 PDF">截图/PDF</button>
    <button id="runJs" title="在当前页面执行 JavaScript（CDP，不受 CSP 限制）">执行 JS</button>
    <span class="sep"></span>
    <button id="saveBodies">响应体存盘</button>
    <button id="expHar">导出 HAR</button>
    <button id="expFiltered" title="导出当前列表里筛出来的记录">导出筛选结果</button>
    <button id="statsBtn" title="按域名/类型/状态统计当前标签的抓包">统计概览</button>
    <button id="expPostman" title="把当前记录导出为 Postman Collection">导出 Postman</button>
    <button id="copyMd" title="把当前筛选结果复制为 Markdown 表格">复制表格</button>
    <button id="snapBtn" title="保存抓包快照并对比两次差异">快照</button>
    <span class="sep"></span>
    <button id="recToggle" title="记录点击/输入/提交/滚动/按键 + 请求 + 跳转，落盘为 JSONL">● 开始录制</button>
    <label class="lbl" title="每次点击额外存一张视口截图（默认关，单次录制上限 300 张）"><input id="recShots" type="checkbox"> 点击截图</label>
    <button id="recOpen" class="ghost" title="打开录制目录">录制目录</button>
    <button id="recBrowse" title="浏览 / 重放历史录制">录制历史</button>
    <button id="recSummary" class="ghost" title="打开最近一次录制的 .md 摘要">打开摘要</button>
    <span class="sep"></span>
    <button id="appSettings" class="ghost" title="应用设置：软件渲染 / GPU 状态">设置</button>
    <button id="wipeBtn" class="ghost" title="清理 Cookie / Storage / 缓存 / 日志 / 会话文件">清理数据</button>
  </div>

  <div id="tabstrip">
    <div id="tabList"></div>
    <button id="tabNew" class="ghost" title="新建标签">＋</button>
  </div>

  <div id="body">
    <div id="pageArea"><!-- 原生 BrowserView 覆盖在此区域之上 --></div>
    <div id="panel">
      <div id="splitter" title="拖动调整面板宽度"></div>
      <div id="banner" hidden>
        <span id="bannerText"></span>
        <span id="bannerActions"></span>
        <button id="bannerClose" class="ghost">忽略</button>
      </div>
      <div id="recPanel" hidden><div id="recHead" class="lbl">录制中 · 最近 20 条</div><div id="recItems"></div></div>
      <div id="panelHead">
        <input id="filter" placeholder="过滤：url 子串 / method:post / status:4xx / type:xhr / mime:json / domain:x / size:&gt;100k / time:&gt;500（前缀 ! 取反）">
        <select id="typeFilter">
          <option value="">全部类型</option>
          <option>XHR</option><option>Fetch</option><option>Document</option>
          <option>Script</option><option>Stylesheet</option><option>Image</option>
          <option>Media</option><option>Font</option><option>WebSocket</option><option>Other</option>
        </select>
        <select id="colSet" title="列表列">
          <option value="d">方法·状态·URL·耗时</option>
          <option value="dt">附加类型·大小</option>
          <option value="t">时间戳</option>
        </select>
        <select id="sortBy" title="列表排序 / 分组">
          <option value="time">时间</option>
          <option value="domain">域名分组</option>
          <option value="size">大小↓</option>
          <option value="duration">耗时↓</option>
          <option value="status">状态</option>
        </select>
      </div>
      <div id="listNote" class="lbl" hidden></div>
      <div id="tabs">
        <button class="tab on" data-view="list">请求 <span id="nReq">0</span></button>
        <button class="tab" data-view="ws">WebSocket <span id="nWs">0</span></button>
        <button class="tab" data-view="wf">瀑布 <span id="nWf">0</span></button>
      </div>
      <div id="findbar" hidden>
        <input id="findText" placeholder="页面内查找">
        <button id="findPrev" title="上一个">↑</button>
        <button id="findNext" title="下一个">↓</button>
        <span id="findCount" class="lbl"></span>
        <button id="findClose" class="ghost" title="结束查找">✕</button>
      </div>
      <div id="list"><div class="empty">等待抓取…</div></div>
      <div id="wsView"><div id="wsbar">
        <label class="lbl" title="暂停后新帧不再进入列表（数据仍在主进程）"><input id="wsPause" type="checkbox"> 暂停</label>
        <input id="wsFilter" placeholder="帧内容过滤">
        <button id="wsClear" class="ghost">清空显示</button>
        <span id="wsNote" class="lbl"></span>
      </div><div id="ws"></div></div>
      <div id="wfView">
        <div id="wfbar"><span id="wfInfo" class="lbl"></span><span id="wfScale" class="lbl"></span></div>
        <div id="wf"></div>
      </div>
      <button id="listNew" class="ghost" hidden></button>
      <div id="detail"></div>
    </div>
  </div>

  <div id="modal" hidden>
    <div id="modalBox">
      <div id="modalHead"><span id="modalTitle"></span><button id="modalClose" class="ghost">✕</button></div>
      <div id="modalBody"></div>
      <div id="modalFoot"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="ctxMenu" hidden></div>

  <script src="./renderer.js"></script>
</body>
</html>
